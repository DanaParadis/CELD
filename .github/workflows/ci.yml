name: CELD CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v4
        with:
          node-version: 26.1.0
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Lint client
        working-directory: client
        run: npm run lint
      - name: Test client
        working-directory: client
        run: npm test -- --run
      - name: Build client
        working-directory: client
        run: npm run build
      - name: Test API with SQLite
        run: dotnet test server/CELD.Api.Tests/CELD.Api.Tests.csproj
      - name: Build API
        run: dotnet build server/CELD.Api/CELD.Api.csproj --no-restore
